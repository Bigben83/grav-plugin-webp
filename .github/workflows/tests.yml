name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, exif, mbstring
          coverage: none

      # Adds the dev tools to vendor/; the result is only used inside this job.
      - run: composer install --no-interaction --no-progress

      - run: php vendor/bin/codecept run unit

  smoke:
    name: Grav 2 smoke test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, exif, mbstring, curl, zip, dom, openssl
          coverage: none

      - name: Download the latest Grav 2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/getgrav/grav/releases --jq '[.[] | select(.tag_name | startswith("2.")) | .tag_name][0]')
          echo "Grav $tag"
          curl -fsSL -o grav.zip "https://github.com/getgrav/grav/releases/download/$tag/grav-v$tag.zip"
          unzip -q grav.zip

      # Install exactly the files a release ships: the tracked tree, with the committed vendor/.
      - name: Install the plugin
        run: |
          mkdir -p grav/user/plugins/webp
          git -C plugin archive HEAD | tar -x -C grav/user/plugins/webp

      - name: Run the smoke test
        working-directory: grav
        run: php user/plugins/webp/tests/smoke/smoke.php
